<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Graft-Busters</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="title">Graft-Busters</div>
      <div class="subtitle">
        Game aksi multiplayer Godot tentang kejar-kejaran antara mahasiswa dan
        tikus kantor berdasi
      </div>
    </header>

    <section class="hero">
      <img
        src="../img/logo.png"
        alt="Game Logo"
        style="border-radius: 6px; width: 500px; margin: 0px;"
      />
      <p>
        Siapkan dirimu dalam permainan aksi satir politik berbasis Godot Engine!
      </p>
      <div style="display: flex; flex-direction: column; justify-content: center; gap: 6px; align-items: center;">
        <button class="btn-play" style="flex: 1; width: 200px;">Solo Player</button>
        <button class="btn-play" style="flex: 1; width: 200px;">MultiPlayer</button>
        <button class="btn-play" style="flex: 1; width: 200px; background-color: gray">Settings</button>
      </div>
    </section>

    <footer>
      © 2025 Graft-Busters - GNCBA - Bertemakan kejar kejaran mahasiswa dengan
      tikus tikus kantor
    </footer>
  </body>
</html>
